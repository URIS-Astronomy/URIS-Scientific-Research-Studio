name: Build TOD Astro Suite

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build, test, and lint
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Stage Engineering RC APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TOD_Astro_Photography.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TOD-Astro-Photography-APK
          path: TOD_Astro_Photography.apk
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: windows/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and analyze
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/overlay.js
      - name: Build Windows GUI
        run: go build -trimpath -ldflags="-s -w -H=windowsgui" -o ../TOD_Astro_Suite.exe .
      - name: Bundle USB transport
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "tod-platform-tools.zip"
          $unpacked = Join-Path $env:RUNNER_TEMP "tod-platform-tools"
          $bundle = Join-Path $env:GITHUB_WORKSPACE "TOD-Astro-Suite-Windows"
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools_r37.0.3-win.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne "89d108360a3bf2924d3bea837239edaccc22fd6ff5befd3787c4348a9fe4f09d") {
            throw "Android platform-tools checksum mismatch"
          }
          Expand-Archive $archive $unpacked
          New-Item -ItemType Directory -Path "$bundle/platform-tools" -Force | Out-Null
          Copy-Item ../TOD_Astro_Suite.exe $bundle
          foreach ($file in "adb.exe", "AdbWinApi.dll", "AdbWinUsbApi.dll", "NOTICE.txt", "source.properties") {
            Copy-Item "$unpacked/platform-tools/$file" "$bundle/platform-tools/"
          }
          & "$bundle/platform-tools/adb.exe" version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: TOD-Astro-Suite-Windows
          path: TOD-Astro-Suite-Windows/
          if-no-files-found: error
