name: Build TOD Astro Suite

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build, test, and lint
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Stage Engineering RC APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TOD_Astro_Photography.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TOD-Astro-Photography-APK
          path: TOD_Astro_Photography.apk
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: windows/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and analyze
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/overlay.js
      - name: Embed the Windows app icon
        run: |
          go install github.com/akavel/rsrc@v0.10.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path (go env GOPATH) "bin/rsrc.exe") -arch amd64 -ico tod_astro.ico -o tod_astro_windows_amd64.syso
      - name: Build Windows GUI
        run: go build -trimpath -ldflags="-s -w -H=windowsgui" -o ../TOD_Astro_Suite.exe .
      - name: Smoke-test the Windows executable
        shell: pwsh
        run: |
          $app = Start-Process -FilePath (Resolve-Path ../TOD_Astro_Suite.exe) -PassThru
          $base = 'http://127.0.0.1:47871'
          try {
            $state = $null
            for ($attempt = 0; $attempt -lt 30 -and !$state; $attempt++) {
              if ($app.HasExited) { throw "TOD Astro Suite exited before serving its dashboard" }
              try { $state = Invoke-RestMethod "$base/api/state" -TimeoutSec 1 } catch { Start-Sleep -Milliseconds 250 }
            }
            if ($state.app -ne 'TOD Astro Suite' -or $state.version -ne '1.0.2 Capture RC') {
              throw "The Windows executable did not serve the expected dashboard"
            }
            $report = Invoke-RestMethod "$base/api/diagnostics"
            if ($report.state.version -ne $state.version) { throw "Diagnostics response failed" }
            Invoke-RestMethod "$base/api/exit" -Method Post | Out-Null
            if (!$app.WaitForExit(10000) -or $app.ExitCode -ne 0) { throw "Application exit failed" }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id }
          }
      - name: Bundle USB transport
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "tod-platform-tools.zip"
          $unpacked = Join-Path $env:RUNNER_TEMP "tod-platform-tools"
          $bundle = Join-Path $env:GITHUB_WORKSPACE "TOD-Astro-Suite-Windows"
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools_r37.0.3-win.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne "89d108360a3bf2924d3bea837239edaccc22fd6ff5befd3787c4348a9fe4f09d") {
            throw "Android platform-tools checksum mismatch"
          }
          Expand-Archive $archive $unpacked
          New-Item -ItemType Directory -Path "$bundle/platform-tools" -Force | Out-Null
          Copy-Item ../TOD_Astro_Suite.exe $bundle
          foreach ($file in "adb.exe", "AdbWinApi.dll", "AdbWinUsbApi.dll", "NOTICE.txt", "source.properties") {
            Copy-Item "$unpacked/platform-tools/$file" "$bundle/platform-tools/"
          }
          & "$bundle/platform-tools/adb.exe" version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundle and test portable Siril
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "siril-1.4.4-ucrt64_win.zip"
          $bundle = Join-Path $env:GITHUB_WORKSPACE "TOD-Astro-Suite-Windows"
          $destination = Join-Path $bundle "siril"
          Invoke-WebRequest -Uri "https://free-astro.org/download/siril-1.4.4-ucrt64_win.zip" -OutFile $archive
          Expand-Archive $archive $destination
          $cli = Get-ChildItem -Path $destination -Recurse -Filter "siril-cli.exe" -File | Select-Object -First 1
          if (!$cli -or $cli.Length -eq 0) { throw "Siril CLI missing from the portable distribution" }
          $env:TOD_TEST_SIRIL_CLI = $cli.FullName
          go test -run '^TestSirilProcessesJPEGSequence$' -v .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @(
            "Siril 1.4.4 portable for Windows. Distributed separately alongside TOD Astro Suite."
            "License and notices are included in the upstream portable distribution."
            "Release and corresponding source code are available at no charge."
            "https://siril.org/download/2026-06-17-siril-1-4-4/"
            "https://free-astro.org/download/siril-1.4.4.tar.bz2"
          ) | Set-Content (Join-Path $bundle "Siril-source.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: TOD-Astro-Suite-Windows
          path: TOD-Astro-Suite-Windows/
          if-no-files-found: error
